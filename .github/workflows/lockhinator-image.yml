name: Build Lockhinator LibreChat image

on:
  push:
    branches: [lockhinator/api-access-panel]

permissions:
  contents: read
  packages: write

concurrency:
  group: lockhinator-librechat-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/lockhinator/librechat:api-access-v0.8.7
          cache-from: type=gha
          cache-to: type=gha,mode=max
